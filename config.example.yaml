execution:
  mode: hybrid  # pgx fetch + iridis slurm align

paths:
  # PGX: replace YOUR_USER with your Unix username on the fetch host
  ledger: /home/YOUR_USER/kitsune/ledger/kitsune.db
  work: /home/YOUR_USER/kitsune/work
  manifest: /home/YOUR_USER/kitsune/manifest
  logs: /home/YOUR_USER/kitsune/logs

iridis:
  # Iridis login node from your site docs (not a specific login host)
  ssh_host: iridis.login.example
  scratch_root: /iridisfs/scratch/YOUR_USER/kitsune
  repo: /iridisfs/scratch/YOUR_USER/kitsune/repo/kitsune-pgx
  ddnb_readonly:
    gencode_star: /iridisfs/ddnb/Luke/kitsune/download_align_data/reference_sources/STAR_index_gencode49
    noncode_star: /iridisfs/ddnb/Luke/kitsune/download_align_data/NONCODE/STAR_index

remote:
  user: YOUR_USER

limits:
  min_free_gb: 200
  max_attempts: 3
  heartbeat_timeout_min: 30
  threads_per_job: 16

options:
  skip_tier_x: true
  skip_already_processed: true
  verify_md5: true
