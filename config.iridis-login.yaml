# Example config when running CLI from an Iridis login node (edit YOUR_USER).
execution:
  mode: hybrid

paths:
  ledger: /iridisfs/scratch/YOUR_USER/kitsune/repo/kitsune-pgx/ledger/kitsune.db
  work: /iridisfs/scratch/YOUR_USER/kitsune/work
  manifest: /iridisfs/scratch/YOUR_USER/kitsune/repo/kitsune-pgx/manifest
  logs: /iridisfs/scratch/YOUR_USER/kitsune/logs

iridis:
  ssh_host: iridis.login.example
  scratch_root: /iridisfs/scratch/YOUR_USER/kitsune
  repo: /iridisfs/scratch/YOUR_USER/kitsune/repo/kitsune-pgx

remote:
  user: YOUR_USER
